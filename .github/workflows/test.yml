name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        # --isolate is required: without it the cross-transaction tests SKIP rather
        # than run, and a skip is not a pass. scripts/gate.sh enforces the same.
        run: forge test --isolate -vvv

      - name: Check README file:line pointers still resolve
        # The partner-integrations pointers are a submission binary gate, and
        # `forge fmt` reflows source files, so they drift silently.
        run: python scripts/check_pointers.py
